<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradebook</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
                }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Gradebook</h1>
    <script src="gradebook.js"></script>
    <button onclick="fetchGradeData()">Load Grades</button>

    <table id="gradebook">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Assignment 1</th>
                <th>Assignment 2</th>
                <th>Assignment 3</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
    <script>
        function fetchGradeData() {
            fetch('/api/grades')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector('#gradebook tbody');
                    tableBody.innerHTML = ''; // Clear existing rows

                    data.forEach(student => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${student.name}</td>
                            <td>${student.assignment1}</td>
                            <td>${student.assignment2}</td>
                            <td>${student.assignment3}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching grade data:', error));
        }
    </script>       
</body>
</html>
