<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradebook</title>
    <style>
        #error {
            color: red; 
            margin-bottom: 15px;
            min-height: 1.2em; 
        }
        
        table {
            border-collapse: collapse; 
            width: 50%; 
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc; 
            padding: 8px;
            text-align: left;
        }
         th {
            background-color: #f8f8f8; 
        }
    </style>
</head>
<body>
    <h1>Gradebook</h1>
    <script src="/gradebook.js"></script>
    <button id="fetchGrades">Fetch Grades</button>
    <div id="error" class="error"></div>
    <table id="gradebook">
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Assignment 1</th>
          <th>Assignment 2</th>
          <th>Assignment 3</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    
  </body>
  </html>
